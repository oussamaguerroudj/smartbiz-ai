name: modiri_ai
description: Modiri AI — AI-powered small business management app.
publish_to: 'none'
version: 0.1.1+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  google_fonts: ^6.2.1
  video_player: ^2.9.2
  intl: 0.20.2
  # Real barcode camera scanning (Sales/Stock "scan barcode" buttons) —
  # actively maintained, works on Android + iOS without extra native
  # setup beyond the camera permission strings already required.
  mobile_scanner: ^6.0.2
  # Real camera/gallery capture for the AI Invoice Scanner (Phase 6).
  image_picker: ^1.1.2
  # Clinic Ch. 4/7/9 (remaining-issues pass) — image_picker alone can
  # only pick photos, but medical documents are mostly PDFs (reports,
  # analyses, prescriptions), and printing a prescription/invoice needs
  # a way to hand raw PDF bytes to the OS print/share sheet. Neither
  # capability existed anywhere in this app before; these are the
  # standard, actively-maintained Flutter packages for each — not a
  # placeholder, genuinely new infrastructure. Requires `flutter pub get`.
  file_picker: ^8.1.2
  printing: ^5.13.3
  pdf: ^3.11.1
  # Persistent, secure session storage (Keychain on iOS, Keystore-backed
  # EncryptedSharedPreferences on Android) — fixes the "asked to verify
  # again after closing the app" bug: tokens now survive app restarts.
  flutter_secure_storage: ^9.2.2
  # Lightweight persisted preferences — used for the chosen app language
  # (and whether the first-launch language picker has been shown yet).
  shared_preferences: ^2.3.2
  # Offline-First local database & synchronization
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  uuid: ^4.4.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/video/splash.mp4
    - assets/images/logo_splash.png
    - assets/images/app_icon.png
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf

# New app icon (see assets/images/app_icon.png). This regenerates the real,
# per-platform icon files — including Android's mipmap-*/ic_launcher set,
# which isn't hand-edited here — from that single source image. Run:
#   flutter pub get
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

  # Design System v2 ("Modiri AI — Indigo" redesign): typography now
  # renders for real via the google_fonts package — Plus Jakarta Sans for
  # UI text, Space Grotesk for display/headline text — instead of the
  # placeholder 'Inter' fontFamily string that silently fell back to the
  # platform default. See core/theme/app_typography.dart.

flutter_native_splash:
  # Matches the new logo artwork's own background exactly.
  color: "#ffffff"
  # image omitted for direct video splash
  android: true
  ios: false
  web: false