services:
  postgres:
    image: postgres:16
    container_name: smartbiz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartbiz
      POSTGRES_PASSWORD: smartbiz_dev_password
      POSTGRES_DB: smartbiz
    ports:
      - "5432:5432"
    volumes:
      - smartbiz_pgdata:/var/lib/postgresql/data

volumes:
  smartbiz_pgdata:
