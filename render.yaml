services:
  - type: web
    name: smartbiz-ai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node run_migrations.js && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartbiz-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 30m
      - key: JWT_REFRESH_EXPIRES
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        value: oussama.guerroudj@ensia.edu.dz
      - key: BREVO_FROM_NAME
        value: Modiri AI
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: AI_BASE_URL
        value: https://ollama.com/v1
      - key: OLLAMA_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: AI_CHAT_MODEL
        value: gemma4:31b
      - key: OLLAMA_VISION_MODEL
        value: gemma4:31b
      - key: AI_VISION_MODEL
        value: gemma4:31b
      - key: OLLAMA_OCR_MODEL
        value: gemma4:31b
      - key: AI_OCR_MODEL
        value: gemma4:31b

databases:
  - name: smartbiz-db
    plan: free
    databaseName: smartbiz
    user: smartbiz
